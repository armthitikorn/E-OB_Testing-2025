<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนเข้าสู่ระบบ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(-45deg, #6ec6ff, #b388ff, #81d4fa, #ce93d8);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      border-radius: 1rem;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .form-control:focus, .form-select:focus {
      box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
    }

    .btn-success {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-success:hover {
      transform: scale(1.02);
      box-shadow: 0 4px 12px rgba(40, 167, 69, 0.4);
    }

    #messageBox {
      transition: all 0.3s ease;
    }
  </style>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabaseUrl = 'https://wzwyotzzxycqfwercakh.supabase.co';
    const supabaseKey = 'YOUR_ANON_KEY'; // ⚠️ อย่าลืมใส่ Supabase Anon Key ของคุณตรงนี้
    const supabase = createClient(supabaseUrl, supabaseKey);

    function showMessage(text, isError = false) {
      const messageBox = document.getElementById('messageBox');
      messageBox.textContent = text;
      messageBox.style.display = 'block';
      messageBox.className = isError ? 'alert alert-danger mt-3 mb-0' : 'alert alert-success mt-3 mb-0';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('registerForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim().toLowerCase();
        const department = document.getElementById('department').value.trim();
        const experience = document.getElementById('experience').value; // ดึงค่าประสบการณ์ที่เลือก

        if (!email || !experience) {
          showMessage('กรุณากรอกข้อมูลให้ครบถ้วน รวมทั้งเลือกประสบการณ์', true);
          return;
        }

        showMessage('กำลังบันทึกข้อมูล...', false);

        try {
          // 1. บันทึกข้อมูลลงใน Session Storage เพื่อสำรองไว้ใช้งาน
          sessionStorage.setItem('user_email', email);
          sessionStorage.setItem('user_name', name);
          sessionStorage.setItem('user_experience', experience);

          // 2. ตรวจสอบว่ามีผู้ใช้นี้ในตาราง users แล้วหรือยัง
          const { data: userData, error: fetchError } = await supabase
            .from('users')
            .select('*')
            .eq('email', email)
            .maybeSingle();

          if (fetchError) {
            console.error('Error fetching user:', fetchError);
          }

          if (userData) {
            // อัปเดตข้อมูลผู้ใช้เดิมในตาราง users
            const { error: updateError } = await supabase
              .from('users')
              .update({ 
                full_name: name, 
                department: department, 
                experience: experience 
              })
              .eq('email', email);

            if (updateError) console.error('Error updating users:', updateError);
          } else {
            // เพิ่มผู้ใช้ใหม่ลงในตาราง users
            const { error: insertError } = await supabase
              .from('users')
              .insert([{ email, full_name: name, department, experience }]);

            if (insertError) console.error('Error inserting users:', insertError);
          }

          // 3. 🔥 บันทึกค่าประสบการณ์ตั้งต้นลงตาราง quiz_results ด้วย
          const { error: quizError } = await supabase
            .from('quiz_results')
            .insert([
              {
                name: name,
                user_email: email,
                experience: experience,
                score: 0,              // ค่าเริ่มต้นก่อนทำแบบทดสอบ
                total_questions: 0     // ค่าเริ่มต้นก่อนทำแบบทดสอบ
              }
            ]);

          if (quizError) {
            console.error('Error inserting quiz_results:', quizError);
          }

          showMessage('บันทึกข้อมูลเรียบร้อย! กำลังนำทาง...', false);

          // 4. นำทางไปยังหน้าถัดไปพร้อมแนบ Parameter ผ่าน URL
          setTimeout(() => {
            const targetPage = userData ? 'index2.html' : 'index1.html';
            const redirectUrl = `${targetPage}?email=${encodeURIComponent(email)}&name=${encodeURIComponent(name)}&experience=${encodeURIComponent(experience)}`;
            window.location.href = redirectUrl;
          }, 1200);

        } catch (err) {
          console.error('Unexpected error:', err);
          showMessage(`เกิดข้อผิดพลาด: ${err.message}`, true);
        }
      });
    });
  </script>
</head>
<body>
  <div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 420px;">
      <h3 class="text-center mb-4 text-primary">
        <i class="bi bi-person-plus-fill me-2"></i>สรุปผลการทำแบบทดสอบ
      </h3>
      
      <form id="registerForm">
        <div class="mb-3">
          <label for="name" class="form-label">ชื่อ-นามสกุล:</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="กรอกชื่อ-นามสกุล" required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">อีเมล:</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="mb-3">
          <label for="department" class="form-label">แผนก:</label>
          <input type="text" id="department" name="department" class="form-control" placeholder="กรอกแผนก (ถ้ามี)">
        </div>

        <!-- 5 ตัวเลือกประสบการณ์ -->
        <div class="mb-3">
          <label for="experience" class="form-label">ประสบการณ์ทำงาน:</label>
          <select id="experience" name="experience" class="form-select" required>
            <option value="" selected disabled>-- เลือกประสบการณ์ --</option>
            <option value="ไม่มีประสบการณ์">ไม่มีประสบการณ์</option>
            <option value="น้อยกว่า 1 ปี">น้อยกว่า 1 ปี</option>
            <option value="1 - 3 ปี">1 - 3 ปี</option>
            <option value="3 - 5 ปี">3 - 5 ปี</option>
            <option value="มากกว่า 5 ปี">มากกว่า 5 ปี</option>
          </select>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 fs-6">
          <i class="bi bi-box-arrow-in-right me-2"></i>เข้าสู่ระบบ
        </button>
      </form>

      <div id="messageBox" style="display:none;"></div>
    </div>
  </div>
</body>
</html>
